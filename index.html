<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Institute ERP Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="animations.css">
    <style>
        body { font-family: 'Inter', 'Noto Sans Devanagari', sans-serif; overflow-x: hidden; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-[#050811] dark:text-slate-100 transition-colors duration-300 relative min-h-screen">

    <!-- Ambient Background Glow -->
    <div class="no-print fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute -top-32 -left-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
        <div class="absolute bottom-0 right-0 w-96 h-96 bg-cyan-500/15 rounded-full blur-3xl"></div>
    </div>

    <!-- 1. Login Screen -->
    <div id="login-screen" class="relative z-10 min-h-screen flex flex-col justify-center items-center p-4 tab-transition">
        
        <!-- Top Floating Language & Theme Switcher -->
        <div class="mb-4 flex items-center gap-2">
            <button onclick="toggleLanguage()" id="login-lang-btn" class="bg-white/90 dark:bg-slate-800/90 border border-indigo-500/40 text-indigo-600 dark:text-indigo-300 px-4 py-1.5 rounded-full text-xs font-extrabold shadow-lg hover:scale-105 transition">
                🇮🇳 हिंदी में बदलें
            </button>
            <button onclick="toggleTheme()" class="bg-white/90 dark:bg-slate-800/90 border border-slate-300 dark:border-slate-700 px-3 py-1.5 rounded-full text-xs font-bold shadow-lg hover:scale-105 transition">
                🌓
            </button>
        </div>

        <div class="max-w-md w-full glass-panel rounded-3xl shadow-2xl p-7 sm:p-9 border border-slate-200/80 dark:border-indigo-500/20">
            <div class="text-center mb-7">
                <div id="login-logo-box" class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-cyan-500 text-white mx-auto flex items-center justify-center text-3xl shadow-lg mb-3 overflow-hidden">
                    🏫
                </div>
                <h1 id="login-portal-title" class="text-2xl font-extrabold text-slate-900 dark:text-white">
                    Adarsh Vidya Mandir Inter College
                </h1>
                <p id="login-portal-subtitle" class="text-xs text-slate-500 dark:text-slate-400 mt-1">
                    Sign in with your assigned Username & Password
                </p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label id="lbl-username" class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">Username</label>
                    <input type="text" id="login-username" required placeholder="Enter your username" autocomplete="off"
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900/90 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition">
                </div>
                <div>
                    <label id="lbl-password" class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••"
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900/90 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition">
                </div>

                <div id="login-error" class="hidden text-xs font-bold text-rose-500 bg-rose-500/10 border border-rose-500/30 p-3 rounded-xl text-center"></div>

                <button type="submit" id="login-submit-btn" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3 rounded-xl shadow-lg transition transform active:scale-[0.98]">
                    🔐 Secure Login
                </button>
            </form>

            <div id="demo-credentials-hint" class="mt-6 pt-4 border-t border-slate-200 dark:border-slate-800 text-[11px] text-slate-400 text-center"></div>
        </div>
    </div>

    <!-- 2. Dynamic Left Sidebar + Main Dashboard -->
    <div id="dashboard-screen" class="hidden relative z-10 min-h-screen flex flex-col lg:flex-row">
        
        <!-- Dynamic Left Sidebar -->
        <aside id="left-sidebar" class="no-print w-full lg:w-64 glass-panel border-b lg:border-b-0 lg:border-r border-slate-200 dark:border-slate-800/90 p-4 flex flex-col justify-between shrink-0">
            <div>
                <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-200 dark:border-slate-800">
                    <div class="flex items-center gap-2.5 overflow-hidden">
                        <div id="sidebar-logo-box" class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-500 text-white flex items-center justify-center font-bold text-lg shadow shrink-0 overflow-hidden">
                            🏫
                        </div>
                        <div class="overflow-hidden">
                            <h2 id="sidebar-org-name" class="font-bold text-sm text-slate-900 dark:text-white truncate">Adarsh Vidya Mandir</h2>
                            <span id="sidebar-user-badge" class="inline-block text-[10px] font-bold px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 mt-0.5 truncate">User Panel</span>
                        </div>
                    </div>
                </div>

                <!-- 1-Click Language & Theme Control Bar inside Sidebar -->
                <div class="flex items-center gap-2 mb-4">
                    <button onclick="toggleLanguage()" id="sidebar-lang-btn" class="flex-1 bg-indigo-600/15 hover:bg-indigo-600 text-indigo-400 hover:text-white border border-indigo-500/30 py-1.5 px-2.5 rounded-xl text-xs font-extrabold transition text-center">
                        🇮🇳 हिंदी
                    </button>
                    <button onclick="toggleTheme()" title="Theme" class="p-1.5 px-3 rounded-xl bg-slate-200/70 dark:bg-slate-800 text-xs hover:bg-indigo-600 hover:text-white transition">
                        🌓
                    </button>
                </div>

                <div id="sidebar-menu-heading" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-2 mb-2">Main Menu</div>
                <nav id="dynamic-sidebar-nav" class="flex lg:flex-col gap-1.5 overflow-x-auto pb-2 lg:pb-0"></nav>
            </div>

            <div class="pt-4 mt-4 border-t border-slate-200 dark:border-slate-800 space-y-2">
                <div class="px-2 text-[11px] text-slate-400 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    <span id="logged-user-name" class="truncate font-semibold">Active User</span>
                </div>
                <button onclick="logoutUser()" id="btn-logout" class="w-full flex items-center justify-center gap-2 bg-rose-500/10 hover:bg-rose-600 text-rose-400 hover:text-white border border-rose-500/20 px-4 py-2.5 rounded-xl text-xs font-bold transition">
                    🚪 Logout
                </button>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto">
            <div id="main-content" class="max-w-6xl mx-auto"></div>
        </main>
    </div>

    <script src="dashboard.js"></script>
    <script src="app.js"></script>
</body>
</html>
