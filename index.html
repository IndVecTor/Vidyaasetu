<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidyaSetu ERP | Smart Institute Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="animations.css">
    <style>
        body { font-family: 'Inter', 'Noto Sans Devanagari', sans-serif; overflow-x: hidden; scroll-behavior: smooth; }
        
        /* केवल रसीद / मार्कशीट प्रिंट करने का समर्पित नियम (Print-Only Isolation) */
        @media print {
            body * { visibility: hidden !important; }
            #print-only-container, #print-only-container * { visibility: visible !important; }
            #print-only-container {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                background: white !important;
                padding: 10px !important;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-[#050811] dark:text-slate-100 transition-colors duration-300 relative min-h-screen">

    <!-- केवल प्रिंट के समय दिखने वाला गुप्त कंटेनर (Slip Print Layout) -->
    <div id="print-only-container" class="hidden print:block"></div>

    <!-- Ambient Background Glow -->
    <div class="no-print fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute -top-32 -left-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
        <div class="absolute top-1/2 right-0 w-96 h-96 bg-cyan-500/15 rounded-full blur-3xl"></div>
    </div>

    <!-- 1. VidyaSetu आधिकारिक मुख्य होमपेज -->
    <div id="landing-view" class="hidden relative z-10"></div>

    <!-- 2. लॉगिन स्क्रीन -->
    <div id="login-screen" class="hidden relative z-10 min-h-screen flex flex-col justify-center items-center p-4 tab-transition">
        <div class="mb-5 flex items-center gap-3">
            <div onclick="toggleLanguage()" class="lang-pill-switch" id="login-lang-pill" title="Switch Language">
                <div class="lang-pill-thumb"></div>
                <span class="lang-pill-label text-white" id="lbl-pill-en">EN</span>
                <span class="lang-pill-label text-slate-400" id="lbl-pill-hi">हिं</span>
            </div>
            <div onclick="toggleTheme()" class="sky-theme-switch" title="Toggle Dark/Light Theme">
                <div class="sky-theme-thumb" id="login-theme-icon">🌙</div>
            </div>
        </div>

        <div class="max-w-md w-full glass-panel rounded-3xl shadow-2xl p-7 sm:p-9 border border-slate-200/80 dark:border-indigo-500/20">
            <div class="text-center mb-7">
                <div id="login-logo-box" class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-cyan-500 text-white mx-auto flex items-center justify-center text-3xl shadow-lg mb-3 overflow-hidden">
                    🌉
                </div>
                <div class="inline-block text-[10px] font-extrabold tracking-widest uppercase text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-2.5 py-0.5 rounded-full mb-1">
                    VidyaSetu Cloud Portal
                </div>
                <h1 id="login-portal-title" class="text-2xl font-extrabold text-slate-900 dark:text-white">
                    Institute Login
                </h1>
                <p id="login-portal-subtitle" class="text-xs text-slate-500 dark:text-slate-400 mt-1">
                    Sign in with your assigned Username & Password
                </p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label id="lbl-username" class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">Username</label>
                    <input type="text" id="login-username" required placeholder="Enter your username" autocomplete="off"
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900/90 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition">
                </div>
                <div>
                    <label id="lbl-password" class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••"
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900/90 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition">
                </div>

                <div id="login-error" class="hidden text-xs font-bold text-rose-500 bg-rose-500/10 border border-rose-500/30 p-3 rounded-xl text-center"></div>

                <button type="submit" id="login-submit-btn" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3 rounded-xl shadow-lg transition transform active:scale-[0.98]">
                    🔐 Secure Login
                </button>
            </form>

            <div id="demo-credentials-hint" class="mt-6 pt-4 border-t border-slate-200 dark:border-slate-800 text-[11px] text-slate-400 text-center"></div>
            <div class="mt-3 text-center text-[10px] text-slate-500">
                Powered by <a href="?" class="text-indigo-400 font-bold hover:underline">VidyaSetu ERP</a>
            </div>
        </div>
    </div>

    <!-- 3. App-Shell Layout: Grand Top Brand Header + Clean Left Sidebar -->
    <div id="dashboard-screen" class="hidden relative z-10 min-h-screen flex flex-col">
        <header class="no-print sticky top-0 z-30 glass-panel border-b border-indigo-500/25 px-4 sm:px-6 py-3 shadow-lg">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-3.5 min-w-0 flex-1">
                    <div id="topbar-logo-box" class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-cyan-500 text-white flex items-center justify-center font-bold text-xl shadow-lg shadow-indigo-500/30 shrink-0 overflow-hidden">
                        🏫
                    </div>
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded bg-indigo-500/15 text-indigo-400 border border-indigo-500/20">
                                VidyaSetu ERP
                            </span>
                            <span id="topbar-city-tag" class="hidden sm:inline-block text-[11px] text-slate-400 font-medium">
                                • Session 2026-27
                            </span>
                        </div>
                        <h1 id="topbar-org-title" class="text-lg sm:text-2xl font-black tracking-tight bg-gradient-to-r from-slate-900 via-indigo-700 to-cyan-600 dark:from-white dark:via-indigo-200 dark:to-cyan-300 bg-clip-text text-transparent truncate">
                            Adarsh Vidya Mandir Inter College
                        </h1>
                    </div>
                </div>

                <div class="flex items-center gap-2.5 shrink-0">
                    <div class="hidden md:flex flex-col text-right mr-1">
                        <span id="logged-user-name" class="text-xs font-extrabold text-slate-800 dark:text-white">Active User</span>
                        <span id="sidebar-user-badge" class="text-[10px] font-bold text-emerald-400">● Online</span>
                    </div>

                    <div onclick="toggleLanguage()" class="lang-pill-switch" id="topbar-lang-pill" title="Switch Language">
                        <div class="lang-pill-thumb"></div>
                        <span class="lang-pill-label text-white" id="top-pill-en">EN</span>
                        <span class="lang-pill-label text-slate-400" id="top-pill-hi">हिं</span>
                    </div>

                    <div onclick="toggleTheme()" class="sky-theme-switch" title="Switch Day/Night Mode">
                        <div class="sky-theme-thumb" id="topbar-theme-icon">🌙</div>
                    </div>
                </div>
            </div>
        </header>

        <div class="flex-1 flex flex-col lg:flex-row">
            <aside id="left-sidebar" class="no-print w-full lg:w-60 glass-panel border-b lg:border-b-0 lg:border-r border-slate-200 dark:border-slate-800/90 p-3.5 flex flex-col justify-between shrink-0">
                <div>
                    <div id="sidebar-menu-heading" class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 px-2.5 mb-2">
                        Navigation Menu
                    </div>
                    <nav id="dynamic-sidebar-nav" class="flex lg:flex-col gap-1.5 overflow-x-auto pb-1.5 lg:pb-0"></nav>
                </div>

                <div class="pt-3 mt-3 border-t border-slate-200 dark:border-slate-800">
                    <button onclick="logoutUser()" id="btn-logout" class="w-full flex items-center justify-center gap-2 bg-rose-500/10 hover:bg-rose-600 text-rose-400 hover:text-white border border-rose-500/20 px-4 py-2.5 rounded-xl text-xs font-bold transition">
                        🚪 Logout
                    </button>
                </div>
            </aside>

            <main class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto">
                <div id="main-content" class="max-w-6xl mx-auto"></div>
            </main>
        </div>
    </div>

    <!-- सभी मॉड्यूलर JS फ़ाइलें -->
    <script src="landing.js"></script>
    <script src="superanalytics.js"></script>
    <script src="superadmin.js"></script>
    <script src="dashboard.js"></script>
    <script src="fees.js"></script>
    <script src="staff.js"></script>
    <script src="app.js"></script>
</body>
</html>
